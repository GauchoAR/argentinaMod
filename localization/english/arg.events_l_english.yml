l_english:

malvinas.2.t:0 "An offer for the Falklands"
malvinas.2.d:0 "Buenos Aires has made us an offer for the purchase of  The Falklands."
malvinas.2.f:0 ""Argentina offers to pay at the treasury in Buenos Aires, to the diplomatic representative or other agent of [ROOT.GetCountry.GetRuler.GetHerHis] Majesty the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] , A considerable sum of Pesos Fuertes in gold to get the islands back to the argentinian sovereignty.""
malvinas.2.a:0 "The islands are worthless, let the Argentinians have it."
malvinas.2.b:0 "We never sell of a valuable possession in the Atlantic Sea."
malvinas.3.t:0 "The Malvinas Question Resolved"
malvinas.3.d:0 "The British standard descends for the last time from the southern masts. Now, swayed by the freezing winds, it is our light blue and white flag that reclaims the horizon."
malvinas.3.f:0 "Since the fateful usurpation of 1833, the Malvinas and South Georgia Islands have been an open wound in our national pride.\n\nToday, thanks to bold diplomacy, we restore our territorial integrity and definitively reclaim the inalienable heritage bequeathed to us by the Viceroyalty of the Río de la Plata."
malvinas.3.a:0 "The gaucho Rivero will finally be able to rest in peace."

malvinas.4.t:0 "Negotiations for the purchase of the Malvinas have failed"
malvinas.4.d:0 "The negotiations with the British for the purchase of the Malvinas have failed."
malvinas.4.f:0 "We see, therefore, that war is not merely a political act, but also a true political instrument, a continuation of political commerce, carried out by other means."
malvinas.4.a:0 "We will continue diplomacy by other means."

malvinas.1.t:1 "An offer for the Malvinas"
malvinas.1.d:1 "In exchange for this financial aid, the United Kingdom could lower its flag, withdraw its administrators, and recognize our country's absolute sovereignty over the archipelago."
malvinas.1.f:0 "Confidential dispatches arriving from London reveal an undeniable truth: the British Empire is drowning in its own financial tribulations.\n\nIn the dark halls of Whitehall, the cost of maintaining a garrison on distant, wind-battered rocks is beginning to be questioned by Parliament.\n\nIt is the perfect opportunity for our diplomacy to act and correct the usurpation through the power of gold."
malvinas.1.a:1 "Make the necessary arrangements."
malvinas.1.c:1 "We cannot afford such an expense at this time."
malvinas.1.tt1:1 "We will offer payment for the islands over the course of 1 year."

libertad_de_vientres: "Freedom of Wombs"
vientres.2.t: "Slavery Prohibited"
vientres.2.d: "The institution of slavery is now a relic of the past."
vientres.2.f: "In the halls of power and on the old estancias, the laments of traditional landowners over the loss of their "guaranteed labor" were swift to arrive; there were threats, demands for compensation, and dark predictions of economic ruin.\n\nHowever, the law is inexorable, the records of the buying and selling of human beings have been cast into the fires of history.\n\nThough the old masters look upon the new social order with resentment, the gavel has fallen: never again will a man be chained under our flag."
vientres.2.a: "In Union and Liberty!"

the_tarija_question.1.t: "Tarija: A Resolved Matter"
the_tarija_question.1.d: "The northern borders have been sealed by the force of arms and the courage of our men."
the_tarija_question.1.f: "—Excellent news, without a doubt, although the true triumph lies in the geological reports I have just received —intervened the magnate, lighting a cigar—. They say the mountains are pregnant with minerals, just waiting for the tools and the tracks of our trains to awaken.\n\n—This is how a nation is truly woven, gentlemen —concluded the Minister, raising his crystal glass to the light—. The army draws the lines on the surface, but it is industry that drives the roots into the stone. Let the drills and pickaxes begin to sound.."
the_tarija_question.1.a: "It is time to make the most of the region"
the_tarija_question.1.b: "The people of the Tarija province feel more like Bolivians, we will return this province to Bolivia."

mapuche_malon.1.t: "The Malón Incursion"
mapuche_malon.1.d: "Reports arrive from the frontier: Mapuche warriors have gathered in a malón."
mapuche_malon.1.f: "The old estanciero held an unloaded rifle, surrounded by the sepulchral silence that followed the attack. In a matter of minutes, a lifetime of work had vanished into the desert.\n\n—Here on the frontier, civilization is a luxury; we are merely the meat shield protecting the investments."

chaco.1.t: "The Conquest of the Chaco"
chaco.1.d: "The dense jungles of the Gran Chaco devoured the ambitions of entire empires; where the conquerors of old found only arrows, our troops and brave colonists have carried the torch of civilization."
chaco.1.f: "— Sometimes I feel a pang of pity for them, they lived in their savage ignorance until we arrived — the gentleman sighed, looking thoughtfully toward the horizon.\n\n— It is the price of modernity, my friend. Now we must teach them to work the land, to dress decently, to respect private property...\n\n — ...and to pay taxes on it, of course — added the minister with an astute smile, raising his crystal glass."
chaco.1.a: "At last we can walk freely through these endless plains and forests"

islas_malvinas.1.t: "Argentine Malvinas"
islas_malvinas.1.d: "With the islands once again in our possession, we will begin a new era"
islas_malvinas.1.f:  "Behind their mantle of mist, we shall not forget them, "The Argentine Malvinas", cries the wind and roars the sea."
islas_malvinas.1.a: "It is time to assert our control"

hacia_el_sur.1.t: "To the South!"
hacia_el_sur.1.d: "We have finally managed to conquer the South and the West, at last we can begin to populate these areas."
hacia_el_sur.1.f: "Since the 17th century, the Spanish and Portuguese attempted to penetrate these untamable lands, but the ferocity of the natives always prevailed, until now..."
hacia_el_sur.1.a: "At last we can walk freely through these endless plains, forests, and wetlands"

hacia_el_norte.1.t: "To the North!"
hacia_el_norte.1.d: "We have finally managed to conquer the Gran Chaco and Alto Paraguay, at last we can begin to populate these areas"
hacia_el_norte.1.f: "Since the 17th century, the Spanish and Portuguese attempted to penetrate these untamable lands, but the ferocity of the natives always prevailed, until now..."
hacia_el_norte.1.a:  "Let the colonists begin their work."

alto_paraguay.1.t: "Conquest of Alto Paraguay"
alto_paraguay.1.d: "The untamable frontier of Alto Paraguay has finally been subdued to our authority."
alto_paraguay.1.f: "Since the times of the viceroyalties, dominance over Alto Paraguay has been a key piece on the continental board. Whoever controls these floodplains and their tributaries controls the flow of commerce and the security of the northern borders.\n\nWith this campaign concluded, we have definitively closed the door on the territorial ambitions of our neighbors. Our garrisons are now settled along the riverbanks, guaranteeing that this vital strategic artery remains firmly in our hands for generations to come."
alto_paraguay.1.a: "The waters and the jungle now answer to our law."

malon.1.t: "The Malón"
malon.1.d: "The Mapuches gather in warbands and attack our territories."
malon.1.f: "The hot sand becomes a cloud behind the galloping, and coppery riders running through the dunes: Malón!"
malon.1.a: "Send troops to our border at once!"
malon.1.b: "We must send aid to the afflicted"

mapuche_malon.1.a: "Send troops to the border!"
mapuche_malon.1.b: "Fortify the border posts."
mapuche_malon.1.c: "Mobilize a full column and crush the malón."

mapuche_malon_raid_success_tt: "The malón breaches our defenses and devastates the border province."
mapuche_malon_raid_failed_tt: "The malón is repelled, and the experience strengthens our colonization efforts."

mapuche_raid_devastation: "Devastation from malones"
mapuche_raid_devastation_desc: "Recent Mapuche incursions have left this border in a state of desolation..."

welsh_colony.1.t: "A Welsh ship arrives"
welsh_colony.1.d: "Seeking to preserve their language and culture away from British assimilation, a group of Welsh colonists has landed on the shores of Patagonia."
welsh_colony.1.f: "While other European immigrants crowded into the tenements of the metropolis, these Welshmen had explicitly requested lands where no one else wanted to go.\n\nThey were fleeing the oppressive coal mines and English laws, seeking an isolation that only the vast and silent Patagonia could offer them.\n\nWith empty hands but their spirit intact, they come ready to transform the arid and freezing Patagonian desert into their new home."
welsh_colony.1.a: "Welcome to Argentina."

mapuche_after.1.t: "The Mapuches will no longer be a threat"
mapuche_after.1.d: "The Mapuche Confederation, once a proud and defiant people on our southern border, has come to an end."
mapuche_after.1.f: "On the most distant estancias, families can finally sleep without keeping a loaded rifle by the window. News of the military victory has swept the country, bringing a collective sigh of relief to those who inhabit the edges of civilization.\n\nThe threat of the malón, which for so many generations was the greatest terror of our nights, will now become a simple legend that old colonists will tell their grandchildren by the fire."
mapuche_after.1.a: "A new era begins."